<style>
  :root{ --corcho-color:#9C6F3D; }
  .art-wrap{max-width:760px;margin:0 auto;padding:40px 32px 64px;}
  .art-breadcrumb{font-size:12px;color:var(--ink-mute);margin-bottom:18px;}
  .art-breadcrumb a{color:var(--ink-mute);}
  .art-badge{display:inline-flex;align-items:center;gap:6px;background:var(--corcho-color);color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:6px 14px;border-radius:3px;margin-bottom:18px;}

  .art-meta{font-size:13px;color:var(--ink-mute);margin:0 0 28px;}
  .art-box{background:var(--card);border-radius:6px;padding:28px;box-shadow:0 6px 14px rgba(0,0,0,.06);}
  .art-box p{font-family:'Inter',serif;font-size:16px;line-height:1.75;color:var(--ink-soft);margin:0 0 20px;}
  .art-contact{display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;font-size:14px;}
  .art-contact strong{display:block;font-size:11px;text-transform:uppercase;color:var(--ink-mute);margin-bottom:4px;}
  .art-nav-bottom{margin-top:28px;font-size:13px;}
  .art-nav-bottom a{color:var(--ink-mute);}
</style>
